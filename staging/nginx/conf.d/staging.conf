# Staging Virtual Host Configuration
# Reverse Proxy with TLS 1.3 Termination for Diabetic Retinopathy API

upstream retina_backend {
    server retina-api:5000;
    keepalive 32;
}

# HTTP: Port 80 - Redirect all traffic to HTTPS (port 8443 in staging)
server {
    listen 80;
    server_name localhost retina-staging.local;

    # Return 301 redirect to HTTPS port 8443
    return 301 https://$host:8443$request_uri;
}

# HTTPS: Port 443 - Hardened TLS 1.3 Reverse Proxy
server {
    listen 443 ssl;
    server_name localhost retina-staging.local;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;

    # TLS Protocols & Modern Ciphers
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Payload buffer size for high-resolution retinal fundus photographs
    client_max_body_size 16M;

    # Dedicated Health Check Endpoint
    location /api/health {
        proxy_pass http://retina_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API and Application Routing
    location / {
        proxy_pass http://retina_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
