services:
  retina-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetic-retinopathy-api-staging
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - staging-net
    expose:
      - "5000"
    environment:
      - PORT=5000
      - RETINA_MODEL_PATH=/app/retfound_model.keras
      - RETINA_TFLITE_PATH=${RETINA_TFLITE_PATH:-/app/retfound_model.tflite}
      - USE_TFLITE=${USE_TFLITE:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENABLE_GEMINI_VALIDATION=${ENABLE_GEMINI_VALIDATION:-true}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-15}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SCAN_HMAC_SECRET=${SCAN_HMAC_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "1.0"
          memory: 1024M

  staging-proxy:
    image: nginx:1.27-alpine
    container_name: diabetic-retinopathy-staging-proxy
    restart: unless-stopped
    networks:
      - staging-net
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./staging/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staging/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./staging/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      retina-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k https://localhost:443/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  staging-net:
    driver: bridge
